name: iosApp
options:
  bundleIdPrefix: com.opal
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    # Xcode 15+ run-script sandbox Kotlin/Gradle embed skriptini bloklaydi
    # ("Sandbox: bash(...) deny file-read-data") — shuning uchun o'chirilgan
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opal.app
        PRODUCT_NAME: Opal
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iosApp/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # `embedAndSignAppleFrameworkForXcode` framework'ni shu yerga sinxronlaydi
        # (composeApp build/bin/... EMAS!) — aks holda "framework not found"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    preBuildScripts:
      - name: Build Kotlin Framework
        script: |
          set -e
          cd "$SRCROOT/.."

          # ---- JDK topish --------------------------------------------------
          # Xcode run-script muhitida JAVA_HOME yo'q va PATH minimal bo'ladi,
          # shuning uchun gradlew "Unable to locate a Java Runtime" beradi.
          # JDK'ni qo'lda qidiramiz (JDK 21 > JDK 17 > Android Studio JBR).
          JDKS=""
          add_jdk() {
            [ -n "$1" ] || return 0
            [ -x "$1/bin/java" ] || return 0
            case ":$JDKS:" in *":$1:"*) return 0 ;; esac
            JDKS="${JDKS:+$JDKS:}$1"
          }
          add_jdk "${JAVA_HOME:-}"
          for v in 21 17; do
            add_jdk "$(/usr/libexec/java_home -v "$v" 2>/dev/null || true)"
          done
          add_jdk "/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          add_jdk "$HOME/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          for d in "$HOME/Library/Java/JavaVirtualMachines"/*/Contents/Home \
                   "/Library/Java/JavaVirtualMachines"/*/Contents/Home \
                   /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home \
                   /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
                   /usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home; do
            add_jdk "$d"
          done

          if [ -z "$JDKS" ]; then
            echo "error: JDK topilmadi. O'rnating: brew install openjdk@21" >&2
            exit 1
          fi

          export JAVA_HOME="${JDKS%%:*}"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "note: JAVA_HOME=$JAVA_HOME"
          echo "note: Gradle topa oladigan JDK'lar: $JDKS"

          # Birinchi JDK wrapper'ni ishga tushiradi, qolganlari esa
          # gradle/gradle-daemon-jvm.properties talab qilgan JDK 21 daemon
          # toolchain'i uchun ro'yxatga qo'shiladi (internetdan yuklab o'tirmaslik uchun).
          sh ./gradlew \
            -Dorg.gradle.java.installations.paths="$JDKS" \
            :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
