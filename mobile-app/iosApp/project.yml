name: iosApp
options:
  bundleIdPrefix: com.opal
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    # Xcode 15+ run-script sandbox Kotlin/Gradle embed skriptini bloklaydi
    # ("Sandbox: bash(...) deny file-read-data") — shuning uchun o'chirilgan
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opal.app
        PRODUCT_NAME: Opal
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iosApp/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # `embedAndSignAppleFrameworkForXcode` framework'ni shu yerga sinxronlaydi
        # (composeApp build/bin/... EMAS!) — aks holda "framework not found"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    preBuildScripts:
      - name: Build Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          # gradlew executable bo'lmasa ham ishlashi uchun `sh` bilan chaqiramiz
          sh ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
