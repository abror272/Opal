<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="928" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12141F"/>
      <stop offset="0.5" stop-color="#080B12"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <radialGradient id="aura" cx="512" cy="470" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C8CFF" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#7FE7D0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7FE7D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="340" y1="330" x2="690" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="0.35" stop-color="#A9E8B8"/>
      <stop offset="0.7" stop-color="#6FD9E8"/>
      <stop offset="1" stop-color="#B08CFF"/>
    </linearGradient>
    <linearGradient id="spark" x1="470" y1="430" x2="560" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#EDE4FF"/>
      <stop offset="1" stop-color="#9BF2DD"/>
    </linearGradient>
    <linearGradient id="orbit" x1="220" y1="520" x2="804" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9E8B8" stop-opacity="0.0"/>
      <stop offset="0.25" stop-color="#A9E8B8" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#B08CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B08CFF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#aura)"/>

  <!-- orbita -->
  <ellipse cx="512" cy="536" rx="322" ry="104" fill="none" stroke="url(#orbit)"
           stroke-width="7" transform="rotate(-17 512 536)"/>
  <circle cx="792" cy="470" r="9" fill="#F0E9FF"/>

  <!-- darvoza/arkaning nuri -->
  <path d="M352 726 L352 506 A160 160 0 0 1 672 506 L672 726"
        fill="none" stroke="#8AF0D6" stroke-opacity="0.55" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)"/>

  <!-- darvoza/arka -->
  <path d="M352 726 L352 506 A160 160 0 0 1 672 506 L672 726"
        fill="none" stroke="url(#edge)" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- yorug'lik yulduzchasi -->
  <path d="M512 418 C521 480 542 501 604 510 C542 519 521 540 512 602 C503 540 482 519 420 510 C482 501 503 480 512 418 Z"
        fill="url(#spark)"/>

  <!-- kichik ichki nur -->
  <path d="M352 506 A160 160 0 0 1 512 346" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
</svg>
