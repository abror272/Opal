<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Opal — Internet yo'q</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, #0c1512 0%, #05060f 70%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 320px; }
    .crystal {
      font-size: 64px; line-height: 1; margin-bottom: 18px;
      filter: drop-shadow(0 0 26px rgba(150, 240, 190, 0.5));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
    p { margin-top: 10px; font-size: 13.5px; line-height: 1.55; color: rgba(255,255,255,0.5); }
    .mint { color: #b7f5cd; font-weight: 700; }
    button {
      margin-top: 22px; padding: 13px 30px; border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.07));
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; backdrop-filter: blur(10px);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="crystal">💎</div>
    <h1>Internet aloqasi yo'q</h1>
    <p>Opal <span class="mint">offline rejimda</span> ishlayapti. Tarmoq qayta ulanganda barcha statistikangiz sinxronlanadi.</p>
    <button onclick="location.reload()">Qayta urinish</button>
  </main>
</body>
</html>
